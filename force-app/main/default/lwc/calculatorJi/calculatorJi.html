<template>
    <lightning-card title="Simple Calculator">
        <div class="container">

            <!-- Display -->
            <input type="text" value={display} readonly class="display"/>

            <!-- Buttons -->
            <div class="buttons">
                <template for:each={buttons} for:item="btn">
                    <button key={btn} data-value={btn} onclick={handleClick}>
                        {btn}
                    </button>
                </template>
            </div>

        </div>
    </lightning-card>
</template>
